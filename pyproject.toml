[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "structural_skill"
version = "0.1.0"
description = "Optimización de secciones y armaduras según NB 1225001 y NBDS-2023"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "fpdf2>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 100
